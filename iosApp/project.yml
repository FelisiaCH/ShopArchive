name: iosApp
options:
  deploymentTarget:
    iOS: "17.4"
targets:
  iosApp:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: iosApp
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_NAME: ShopArchive
        PRODUCT_BUNDLE_IDENTIFIER: xyz.felismp.shoparchive
        INFOPLIST_FILE: iosApp/Info.plist
        SWIFT_VERSION: "5.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: $(inherited) -framework ComposeApp
    preBuildScripts:
      - name: Compile Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
