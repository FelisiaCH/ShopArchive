# The iOS app on macOS. `xcodegen generate` (in this folder) makes ShopArchive.xcodeproj, which is not committed; on Linux, xtool.yml builds the same app.
# The shared code is built by Gradle (:clientCore) as a static framework, ClientCore, before Swift is compiled.
name: ShopArchive
options:
  bundleIdPrefix: xyz.felismp
  developmentLanguage: en
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Kotlin/Native has no x86_64 simulator target; the simulator on an Apple-silicon Mac is arm64.
    ARCHS: arm64
targets:
  ShopArchive:
    type: application
    platform: iOS
    sources:
      - ShopArchive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.felismp.shoparchive
        # The app's own keys are in AppInfo.plist, shared with xtool; Xcode adds the standard ones.
        INFOPLIST_FILE: AppInfo.plist
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        # The script phase below runs Gradle, which Xcode's sandbox would block.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../clientCore/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: $(inherited) -framework ClientCore
    preBuildScripts:
      - name: Build ClientCore
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.." && ./gradlew :clientCore:embedAndSignAppleFrameworkForXcode
