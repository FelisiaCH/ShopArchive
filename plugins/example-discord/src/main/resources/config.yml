# Example Discord channel (a template for your own channel plugin; not shipped with the server).
# Copied to plugins/ExampleDiscord/config.yml the first time the plugin runs. `reload ExampleDiscord` reads it again.
#
# Used only when webhook-url is filled in. Otherwise it warns at start and does not take over: the server sends to the next channel (Telegram, or its own log).

# The channel's webhook (Channel settings > Integrations > Webhooks). A secret: shown as *** by `plugins info`.
# Must be an https address with a path (http only for localhost); otherwise the plugin is not used.
webhook-url: ""

# lo, th or en.
language: lo

# Which events are sent (the server's notify.events decides which reach any channel).
events:
  - day.closed
  - entry.created

# How long to wait for Discord, in seconds (2 to 25). Keep it below notify.timeout-seconds (default 30).
http-timeout-seconds: 10

# The text of each message, by event and language. Plain text, one line per line.
# Words in braces are replaced by the message's data:
#   {type} (income / expense, in the language above)  {category}  {item}  {amount}  {currency}  {branch}  {user}  {time}  {date}  {code}
#   day.closed also has {closedBy} {entries} {slips} {note} and, per currency (one text, e.g. "LAK 150000; THB 20.50"):
#   {income} {expense} {net} {cashIn} {cashOut} {onlineIn} {onlineOut} {float} {counted} {expected} {variance} {kept} {handover}
# A line whose words are all empty (no {category}, no {note}) is left out. An unknown word becomes empty.
# {code} names the entry or the day: a message that arrives twice has the same code both times.
templates:
  entry-created:
    lo: |-
      {type} · {branch}
      {amount} {currency}
      {category} {item}
      {user} · {time}
      ລະຫັດ {code}
    th: |-
      {type} · {branch}
      {amount} {currency}
      {category} {item}
      {user} · {time}
      รหัส {code}
    en: |-
      {type} · {branch}
      {amount} {currency}
      {category} {item}
      {user} · {time}
      Code {code}
  day-closed:
    lo: |-
      ປິດຍອດ {date} · {branch}
      ປິດໂດຍ {closedBy} · {entries} ລາຍການ
      ລາຍຮັບ {income}
      ລາຍຈ່າຍ {expense}
      ສຸດທິ {net}
      ເງິນສົດເຂົ້າ {cashIn} / ອອກ {cashOut}
      ໂອນເຂົ້າ {onlineIn} / ອອກ {onlineOut}
      ເງິນທອນເປີດວັນ {float}
      ນັບໄດ້ {counted} (ຄວນມີ {expected}) ຜິດຍອດ {variance}
      ເກັບເງິນທອນໄວ້ {kept}
      ຍອດສົ່ງ {handover}
      ສະລິບ {slips}
      {note}
      ລະຫັດ {code}
    th: |-
      ปิดยอด {date} · {branch}
      ปิดโดย {closedBy} · {entries} รายการ
      รายรับ {income}
      รายจ่าย {expense}
      สุทธิ {net}
      เงินสดเข้า {cashIn} / ออก {cashOut}
      โอนเข้า {onlineIn} / ออก {onlineOut}
      เงินทอนเปิดวัน {float}
      นับได้ {counted} (ควรมี {expected}) ส่วนต่าง {variance}
      เก็บเงินทอนไว้ {kept}
      ยอดส่ง {handover}
      สลิป {slips}
      {note}
      รหัส {code}
    en: |-
      Day closed {date} · {branch}
      Closed by {closedBy} · {entries} entries
      Income {income}
      Expense {expense}
      Net {net}
      Cash in {cashIn} / out {cashOut}
      Transfer in {onlineIn} / out {onlineOut}
      Opening float {float}
      Counted {counted} (expected {expected}) variance {variance}
      Float kept {kept}
      Handover {handover}
      Slips {slips}
      {note}
      Code {code}
