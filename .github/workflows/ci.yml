name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  JVM_TESTS: ":shared:jvmTest :shoparchive-api:test :server-launcher:test :server:test"

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Android platform 37 (API level 37.0)
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"'
      # build = JVM tests + Android build + checkI18nParity (wired into check)
      - run: ./gradlew build

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew $JVM_TESTS :composeApp:packageMsi
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: ShopArchive-msi
          path: composeApp/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error

  # The iOS targets of the shared code and the client core build only on macOS: tests on the simulator, plus the device build, plus the app itself.
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Android platform 37 (API level 37.0)
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"'
      - run: ./gradlew :shared:iosSimulatorArm64Test :clientCore:iosSimulatorArm64Test :clientCore:compileKotlinIosArm64
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: iosApp
      # Unsigned simulator build; its script phase builds the ClientCore framework through Gradle.
      - run: xcodebuild -project ShopArchive.xcodeproj -scheme ShopArchive -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -configuration Debug -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build
        working-directory: iosApp
      # The version numbers and the Bonjour service come from the generated AppInfo.plist: show that Xcode kept them.
      - run: |
          plist=build/DerivedData/Build/Products/Debug-iphonesimulator/ShopArchive.app/Info.plist
          for key in CFBundleShortVersionString CFBundleVersion NSBonjourServices; do /usr/libexec/PlistBuddy -c "Print :$key" "$plist"; done
        working-directory: iosApp
      # Kotlin/Native links Apple binaries only on macOS: on Linux, iosApp/fetch-clientcore.sh downloads this and xtool builds the app with it.
      - run: ./gradlew :clientCore:assembleClientCoreReleaseXCFramework
      - uses: actions/upload-artifact@v7
        with:
          name: ClientCore-xcframework
          path: clientCore/build/XCFrameworks/release/
          if-no-files-found: error
      # xtool on Linux cannot compile the asset catalog (the app icon): compile it here, and fetch-clientcore.sh downloads Assets.car.
      - run: |
          mkdir -p build/assets
          xcrun actool ShopArchive/Assets.xcassets --compile build/assets --platform iphoneos --minimum-deployment-target 16.0 --app-icon AppIcon --target-device iphone --output-partial-info-plist build/assets/partial.plist
          cat build/assets/partial.plist
        working-directory: iosApp
      - uses: actions/upload-artifact@v7
        with:
          name: ios-assets
          path: iosApp/build/assets/Assets.car
          if-no-files-found: error

  # Manual only: GitHub-hosted arm64 runners may be unavailable to private repos.
  linux-arm64:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew $JVM_TESTS
