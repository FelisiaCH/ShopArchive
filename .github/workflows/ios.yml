name: iOS

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: iosApp
      - name: Archive (unsigned)
        run: >
          xcodebuild archive
          -project iosApp/iosApp.xcodeproj
          -scheme iosApp
          -configuration Release
          -destination "generic/platform=iOS"
          -archivePath build/ShopArchive.xcarchive
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=""
      - name: Build ipa
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ShopArchive.xcarchive/Products/Applications/ShopArchive.app build/ipa/Payload/
          (cd build/ipa && zip -qry ../ShopArchive.ipa Payload)
      - uses: actions/upload-artifact@v7
        with:
          name: ShopArchive-ipa
          path: build/ShopArchive.ipa
          if-no-files-found: error
