name: Release

# A tag v* builds everything an administrator hands out and keeps it as workflow artifacts.
# No GitHub release is made: download the artifacts, check them, and publish them yourself.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # serverZip builds the jar and the zip; check opens the zip and asserts its contents.
      - run: ./gradlew :server-launcher:serverZip :server-launcher:checkServerZip
      - uses: actions/upload-artifact@v7
        with:
          name: shoparchive-server
          path: server-launcher/build/distributions/shoparchive-server-*.zip
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :composeApp:releaseMsi
        shell: bash
      # Unsigned: Windows SmartScreen warns on the first run (README: More info, then Run anyway).
      - uses: actions/upload-artifact@v7
        with:
          name: ShopArchive-msi
          path: composeApp/build/release/*.msi
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    env:
      # Secrets by name only. Without ANDROID_KEYSTORE_BASE64 the build is unsigned (and says so); the other three are the key's passwords and alias.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      SHOPARCHIVE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      SHOPARCHIVE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      SHOPARCHIVE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Android platform 37 (API level 37.0)
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"'
      - name: Decode the signing key
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SHOPARCHIVE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: the APK and AAB are built unsigned."
          fi
      - run: ./gradlew :androidApp:releaseApk :androidApp:bundleRelease
      - uses: actions/upload-artifact@v7
        with:
          name: ShopArchive-android
          path: |
            androidApp/build/release/*.apk
            androidApp/build/outputs/bundle/release/*.aab
          if-no-files-found: error
