# The one place the release version lives. `version` is the semver x.y.z of every artifact: the server (`versions/<version>/`
# inside its root, the console, `/info`), the APK's versionName and the name of the files in a release. `buildNumber`
# only grows (the APK's versionCode); raise it with every build that is handed out, also when `version` stays.
# The MSI is `<major>.<minor>.<buildNumber>` so Windows Installer upgrades on every build: buildNumber must stay 1..65535 and never go back.
# The core jar carries buildNumber too (with the IDs in server/fixed-issues.txt, as shoparchive-build.properties): a hotfix names
# the build it was made for (target-build).
# PROTOCOL_VERSION (shared/Protocol.kt) is separate and changes only when the API breaks.
version=1.0.0
buildNumber=1

org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3g
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.native.ignoreDisabledTargets=true
