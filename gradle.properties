# The one place the release version lives, set by hand (nothing in the build bumps it): `full.release.hotfix`, e.g. 0.1.1, and a
# build handed out only for testing adds `-betaNNN` (exactly 3 digits, 001..998), e.g. 0.1.1-beta001; a beta is older than the
# final of the same x.y.z and newer than the previous final. Limits: full 0..209, release 0..99, hotfix 0..64 (the build fails otherwise).
# `version` is the name of every artifact: the server (`versions/<version>/` inside its root, the console, `/info`), the APK's
# versionName and the files in a release. Two numbers are derived from it in the root build.gradle.kts, never set by hand:
# the code (the APK's versionCode, and the core jar's build, with the IDs in server/fixed-issues.txt, as shoparchive-build.properties;
# a hotfix names the build it was made for with target-build) and the MSI's x.y.z (Windows Installer upgrades when it grows).
# PROTOCOL_VERSION (shared/Protocol.kt) is separate and changes only when the API breaks.
version=0.2.1

org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3g
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
